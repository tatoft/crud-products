spring.application.name=products

# Credenciales por variables de entorno (ver .env.example). Nunca van escritas aquí.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/crud_prueba}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Orígenes del frontend permitidos (CORS), separados por coma
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
